version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sih26001_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sih_user
      POSTGRES_PASSWORD: sih_password
      POSTGRES_DB: sih26001
    ports:
      - "5432:5432"
    volumes:
      - sih26001_pgdata:/var/lib/postgresql/data

volumes:
  sih26001_pgdata:
